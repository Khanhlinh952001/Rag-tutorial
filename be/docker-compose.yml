services:
  db:
    image: pgvector/pgvector:pg15
    container_name: be_postgres_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: rag_tutorial
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:latest
    container_name: be_qdrant
    restart: always
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  tika:
    image: apache/tika:latest
    container_name: be_tika
    restart: always
    ports:
      - "9998:9998"

  redis:
    image: redis:7-alpine
    container_name: be_redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  db_data:
  qdrant_data: